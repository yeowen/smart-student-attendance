<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Attendance System - Launching...</title>
    <link rel="icon" type="image/png" href="pub/assets/logo.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Loading Styles -->
    <link rel="stylesheet" href="pub/css/loading.css">
</head>
<body>
    <!-- Background Ambient Glows & Grid -->
    <div class="ambient-glow glow-top-left"></div>
    <div class="ambient-glow glow-bottom-right"></div>
    <div class="bg-pattern"></div>

    <main class="loading-container">
        <div class="loading-card">
            <!-- Animated QR Scanner Visual -->
            <div class="scanner-wrapper">
                <div class="scanner-frame">
                    <span class="corner corner-tl"></span>
                    <span class="corner corner-tr"></span>
                    <span class="corner corner-bl"></span>
                    <span class="corner corner-br"></span>
                    
                    <div class="qr-preview">
                        <!-- Stylized QR Code SVG -->
                        <svg class="qr-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Top Left Finder Pattern -->
                            <rect x="10" y="10" width="26" height="26" rx="4" stroke="#0d8ae5" stroke-width="4"/>
                            <rect x="18" y="18" width="10" height="10" rx="2" fill="#0d8ae5"/>
                            
                            <!-- Top Right Finder Pattern -->
                            <rect x="64" y="10" width="26" height="26" rx="4" stroke="#0d8ae5" stroke-width="4"/>
                            <rect x="72" y="18" width="10" height="10" rx="2" fill="#0d8ae5"/>
                            
                            <!-- Bottom Left Finder Pattern -->
                            <rect x="10" y="64" width="26" height="26" rx="4" stroke="#0d8ae5" stroke-width="4"/>
                            <rect x="18" y="72" width="10" height="10" rx="2" fill="#0d8ae5"/>
                            
                            <!-- QR Data Bits -->
                            <rect x="44" y="12" width="6" height="6" rx="1.5" fill="#0284c7"/>
                            <rect x="52" y="20" width="6" height="6" rx="1.5" fill="#38bdf8"/>
                            <rect x="44" y="28" width="6" height="6" rx="1.5" fill="#0284c7"/>
                            
                            <rect x="12" y="44" width="6" height="6" rx="1.5" fill="#38bdf8"/>
                            <rect x="22" y="52" width="6" height="6" rx="1.5" fill="#0284c7"/>
                            <rect x="30" y="44" width="6" height="6" rx="1.5" fill="#0284c7"/>
                            
                            <rect x="44" y="44" width="12" height="12" rx="3" fill="#0d8ae5"/>
                            <rect x="62" y="46" width="6" height="6" rx="1.5" fill="#38bdf8"/>
                            <rect x="74" y="52" width="6" height="6" rx="1.5" fill="#0284c7"/>
                            <rect x="82" y="44" width="6" height="6" rx="1.5" fill="#38bdf8"/>
                            
                            <rect x="44" y="68" width="6" height="6" rx="1.5" fill="#38bdf8"/>
                            <rect x="54" y="64" width="6" height="6" rx="1.5" fill="#0284c7"/>
                            <rect x="64" y="74" width="8" height="8" rx="2" fill="#0d8ae5"/>
                            <rect x="78" y="68" width="8" height="8" rx="2" fill="#0284c7"/>
                            <rect x="74" y="82" width="12" height="6" rx="1.5" fill="#38bdf8"/>
                            <rect x="52" y="80" width="6" height="8" rx="1.5" fill="#0284c7"/>
                        </svg>

                        <!-- Laser Scan Line -->
                        <div class="scanner-laser"></div>
                    </div>
                </div>
                <div class="pulse-ring"></div>
            </div>

            <!-- Branding & Titles -->
            <div class="badge-pill">
                <span class="sparkle">✦</span>
                <span>SMART ATTENDANCE PORTAL</span>
            </div>

            <h1 class="brand-title">Smart Student Attendance</h1>
            <p class="brand-subtitle">and Monitoring System Using QR Code</p>

            <!-- Loading Progress Section -->
            <div class="progress-section">
                <div class="progress-header">
                    <span id="status-text" class="status-text">Initializing secure environment...</span>
                    <span id="percentage-text" class="percentage-text">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progress-bar" class="progress-bar">
                        <div class="progress-glow"></div>
                    </div>
                </div>
            </div>

            <!-- Footer indicator -->
            <div class="loading-footer">
                <div class="security-tag">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                    <span>Encrypted Faculty Gateway</span>
                </div>
                <button id="skip-btn" class="skip-btn" type="button">
                    Skip waiting &rarr;
                </button>
            </div>
        </div>
    </main>

    <!-- Loading Script -->
    <script src="pub/js/loading.js"></script>
</body>
</html>
